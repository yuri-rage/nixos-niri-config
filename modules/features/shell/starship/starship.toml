format = """
[](#3B4252)\
$python\
$username\
[](bg:#434C5E fg:#3B4252)\
$directory\
[](fg:#434C5E bg:#4C566A)\
$git_branch\
$git_status\
[](fg:#4C566A bg:#86BBD8)\
$nix_shell\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
[](fg:#86BBD8 bg:#06969A)\
$docker_context\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
"""

command_timeout = 5000
scan_timeout = 250

[username]
show_always = true
style_user = "bg:#3B4252 fg:#ECEFF4"
style_root = "bg:#3B4252 fg:#BF616A"
format = '[$user ]($style)'

[directory]
style = "bg:#434C5E fg:#ECEFF4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "
"wiki" = " iki"

[git_branch]
symbol = " "
style = "bg:#4C566A fg:#ECEFF4"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:#4C566A fg:#ECEFF4"
format = '[$all_status$ahead_behind ]($style)'

[nix_shell]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol$state ]($style)'

[c]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A fg:#ECEFF4"
format = '[ $symbol$context ]($style)'

[elixir]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[elm]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[java]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[julia]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[nim]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:#3B4252 fg:#ECEFF4"
format = '[(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style = "bg:#86BBD8 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#33658A fg:#ECEFF4"
format = '[ $time ]($style)'
