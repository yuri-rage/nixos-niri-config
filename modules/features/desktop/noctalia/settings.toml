config_version = 13

[bar.default]
background_opacity = 0.0
center = [ "audio_visualizer", "spacer_2", "clock", "spacer_3", "media" ]
concave_edge_corners = false
end = [ "clipboard", "tray", "notifications", "network", "volume", "control-center", "session" ]
margin_ends = 10
shadow = false
thickness = 28

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 618.0
    output = "Virtual-1"
    placement_height = 800.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "cleboost/zed-provider", "local/spotify" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/yuri/.local/state/noctalia/plugins/sources/local"
    name = "local"

[shell]
font_family = "Fira Sans Book"

[theme]
builtin = "Tokyo-Night"
community_palette = "Tomorrow"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper.default]
path = "/home/yuri/Pictures/Wallpapers/clockwork-angels-2.webp"

[wallpaper.last]
path = "/home/yuri/Pictures/Wallpapers/clockwork-angels-2.webp"

[wallpaper.monitors.DP-1]
path = "/home/yuri/Pictures/Wallpapers/clockwork-angels-2.webp"

[wallpaper.monitors.Virtual-1]
path = "/home/yuri/Pictures/Wallpapers/clockwork-angels-2.png"

[weather]
unit = "imperial"

[widget.clock]
format = "{:%d %b   %H:%M:%S}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"